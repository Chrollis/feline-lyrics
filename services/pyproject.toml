[project]
name = "felyrics"
version = "0.0.0"
description = "Felyrics Backend Service"
requires-python = ">=3.12, <3.13"
dependencies = [
    "websockets>=17",
    "numpy>=2.5",
    "stable-ts[fw]",
    "fugashi[unidic-lite]",
    "kiwipiepy",
    "hanja",
    "pypinyin",
    "romanizer",
] # av is excluded; it is built by custom scripts under LGPL
