appId: app.felyrics.desktop
productName: Felyrics

directories:
  output: release

# The main, preload and renderer bundles come from electron-vite; everything the
# app reads outside asar (host backend, builtin plugins) is copied verbatim by
# extraResources so Python can see real files and the utility host can import them.
#
# koffi finds its prebuilt native module as `@koromix/koffi-<platform>-<arch>`
# beside its own package directory, so both trees have to ship. The native
# binary itself must stay outside asar: Windows loads it with dlopen, which
# cannot read a file inside an archive.
files:
  - out/**/*
  - package.json
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*

asarUnpack:
  - "**/node_modules/@koromix/**"
  - "**/*.node"

# koffi ships prebuilt binaries; rebuilding it with Electron's headers is not
# needed and would fail where a C++ toolchain is absent.
npmRebuild: false

extraResources:
  - from: ../../packages/host/backend
    to: host/backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!tests/**"
  - from: ../../plugins/felyrics.media
    to: plugins/felyrics.media
    filter:
      - "package.json"
      - "dist/**/*"
      - "backend/**/*"
      - "!**/__pycache__/**"
      - "!backend/tests/**"

win:
  icon: ../../assets/felyrics-icon.ico
  target:
    - nsis
    - portable

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # NSIS wants 24-bit BMPs; the PNGs in assets are their sources.
  installerSidebar: ../../assets/nsis-sidebar.bmp
  installerHeader: ../../assets/nsis-header.bmp
  installerIcon: ../../assets/felyrics-icon.ico
  uninstallerIcon: ../../assets/felyrics-icon.ico

portable:
  artifactName: ${productName}-${version}-portable.${ext}
